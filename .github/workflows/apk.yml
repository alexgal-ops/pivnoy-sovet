name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk PivnoySovet.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PivnoySovet-apk
          path: PivnoySovet.apk
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "pivnoy-sovet-v1.1.${{ github.run_number }}" PivnoySovet.apk \
            --target "${{ github.sha }}" \
            --title "Пивной совет 1.1 (сборка ${{ github.run_number }})" \
            --notes "APK для установки на Android. Скачайте файл и откройте его на телефоне."
