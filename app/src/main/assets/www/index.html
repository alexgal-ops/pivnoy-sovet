<style>
@font-face{font-family:Manrope;font-weight:500;font-display:swap;src:url(fonts/manrope-cyrillic-500-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Manrope;font-weight:500;font-display:swap;src:url(fonts/manrope-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2212}
@font-face{font-family:Manrope;font-weight:600;font-display:swap;src:url(fonts/manrope-cyrillic-600-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Manrope;font-weight:600;font-display:swap;src:url(fonts/manrope-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2212}
@font-face{font-family:Manrope;font-weight:700;font-display:swap;src:url(fonts/manrope-cyrillic-700-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Manrope;font-weight:700;font-display:swap;src:url(fonts/manrope-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2212}
@font-face{font-family:Manrope;font-weight:800;font-display:swap;src:url(fonts/manrope-cyrillic-800-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Manrope;font-weight:800;font-display:swap;src:url(fonts/manrope-latin-800-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2212}
@font-face{font-family:Unbounded;font-weight:600 800;font-display:swap;src:url(fonts/unbounded-cyrillic-700-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Unbounded;font-weight:600 800;font-display:swap;src:url(fonts/unbounded-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2212}

/* Layout: one-column phone app (max 480px), sticky bottom tabs, bottom sheet for proposing/answering.
   Colour roles: amber FILL = the one action; amber OUTLINE + check = your choice; foam = confirmed. */
:root{
  --bg:#15100B; --surface:#221911; --surface-2:#2E2218; --line:#46341F;
  --fg:#F6EBD6; --muted:#BCA88A; --dim:#9C8668; --amber:#F2A73B; --amber-ink:#1A1109; --amber-soft:rgba(242,167,59,.14);
  --foam:#FFF4DE; --ok:#9CC17A;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button:disabled{cursor:default;opacity:.45}
img{max-width:100%;display:block}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;border-bottom:1px solid var(--surface-2)}
.brand{font-family:var(--display);font-weight:800;font-size:20px;color:var(--amber);letter-spacing:-.2px}
.sub{font-size:12px;color:var(--muted)}
.me{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 12px 3px 3px;min-height:44px}
.me img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.me span{font-weight:600;font-size:13px}
main{flex:1;padding:16px 16px 120px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--display);font-weight:600;font-size:15px;margin:0;text-wrap:balance}
h3{font-size:13px;font-weight:700;margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.lbl{font-size:13px;color:var(--muted)}
.note{font-size:14px;color:var(--muted);line-height:1.45;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
/* choices: outline + check when picked */
.opt{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);font-weight:500;font-size:14px;transition:background-color .15s,border-color .15s}
.opt:active{transform:scale(.97)}
.opt .ck{display:none}
.opt.on{border-color:var(--amber);background:var(--amber-soft);color:var(--foam)}
.opt.on .ck{display:inline-block}
.btn{min-height:50px;border-radius:14px;border:0;background:var(--amber);color:var(--amber-ink);font-weight:800;font-size:15px;padding:0 18px;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:600}
.btn.wide{width:100%}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:8px 0;min-height:36px;align-self:flex-start}
.hero{position:relative;border-radius:20px;overflow:hidden}
.hero img{width:100%;height:180px;object-fit:cover;object-position:center 28%}
.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;background:rgba(15,10,6,.86);display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--amber);font-weight:800}
.big{font-family:var(--display);font-weight:600;font-size:19px;text-wrap:balance}
.invite{border:1px solid var(--amber)}
.who{display:flex;align-items:center;gap:10px}
.who img{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none}
.when{font-family:var(--display);font-weight:600;font-size:18px}
.where b{display:block;font-size:15px}
.where span{font-size:13px;color:var(--muted)}
.maplink{font-size:13px;color:var(--amber)}
.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.person{display:flex;flex-direction:column;align-items:center;gap:5px;position:relative}
.ava{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--line)}
.ava.in{border-color:var(--amber)}
.ava.out{opacity:.4}
.plus{position:absolute;top:0;right:calc(50% - 38px);background:var(--foam);color:var(--amber-ink);font-size:11px;font-weight:800;border-radius:99px;padding:1px 6px}
.st{font-size:12px;font-weight:600;color:var(--muted)}
.st.in{color:var(--amber)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);align-self:flex-start}
.status.ok{background:var(--foam);color:var(--amber-ink)}
.agg{display:flex;flex-direction:column;gap:8px}
.aggrow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.stack{display:flex}
.stack img{width:22px;height:22px;border-radius:50%;object-fit:cover;border:2px solid var(--surface);margin-left:-6px}
.stack img:first-child{margin-left:0}
.divider{height:1px;background:var(--surface-2)}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:#100B07;border-top:1px solid var(--surface-2);padding:6px 8px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
nav button{position:relative;min-height:56px;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600}
nav button.act{color:var(--amber)}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--amber);color:var(--amber-ink);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);display:flex;align-items:center;justify-content:center}
.wd,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.wd{font-size:12px;color:var(--muted)}
.day{height:46px;padding:0;border-radius:12px;border:2px solid transparent;background:transparent;font-weight:600;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums}
.day.past{color:var(--dim)}
.day.today{color:var(--amber);font-weight:800}
.day.sel{border-color:var(--amber)}
.day.conf{background:var(--foam);color:var(--amber-ink)}
.dot{width:6px;height:6px;border-radius:50%;background:transparent}
.dot.p{background:var(--amber)}
.day.conf .dot{background:var(--amber-ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:92%;background:var(--surface);border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--surface-2)}
.sheet-body{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px}
.sheet-foot{padding:12px 16px 14px;border-top:1px solid var(--surface-2);display:flex;flex-direction:column;gap:6px}
.field{display:flex;flex-direction:column;gap:8px}
input[type=text]{width:100%;min-height:46px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:15px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:22px}
.stepper b{min-width:56px;text-align:center;font-size:17px}
details{border:1px solid var(--surface-2);border-radius:14px;padding:4px 12px}
summary{min-height:44px;display:flex;align-items:center;font-weight:600;cursor:pointer}
details[open] summary{margin-bottom:8px}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:18px 0}
.done .tick{width:72px;height:72px;border-radius:50%;background:var(--amber);color:var(--amber-ink);display:flex;align-items:center;justify-content:center}
/* feedback */
.scrollx{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.mchip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 14px;min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.mchip.on{border-color:var(--amber);background:var(--amber-soft)}
.stat{background:var(--surface-2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.stat .n{font-family:var(--display);font-weight:800;font-size:28px;color:var(--amber);font-variant-numeric:tabular-nums}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stars{display:flex;gap:2px}
.rate{display:flex;align-items:center;justify-content:space-between;gap:8px}
.starbtn{width:44px;height:44px;padding:0;border:0;background:none;display:flex;align-items:center;justify-content:center}
.prow{display:flex;align-items:center;gap:12px}
.prow img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.mini{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.mini>span{display:flex;align-items:center;gap:4px}
.cm{display:flex;gap:10px;align-items:flex-start}
.cm img{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:none}
.bubble{background:var(--surface-2);border-radius:4px 14px 14px 14px;padding:8px 12px;min-width:0}
.bubble b{font-size:12px;color:var(--amber)}
.bubble p{margin:2px 0 0;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.banner{font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--foam);color:var(--amber-ink);font-weight:700;font-size:14px;padding:10px 16px;border-radius:99px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:90%;text-align:center}
.pick{display:flex;flex-direction:column;gap:12px;padding:24px 0}
.pick h1{font-family:var(--display);font-weight:800;font-size:26px;margin:0}
.pickbtn{display:flex;align-items:center;gap:14px;padding:12px;border-radius:18px;border:1px solid var(--line);background:var(--surface);text-align:left}
.pickbtn img{width:64px;height:64px;border-radius:50%;object-fit:cover}
.pickbtn b{font-family:var(--display);font-size:17px;font-weight:600}
.pickbtn span{display:block;font-size:13px;color:var(--muted)}
.switchbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header id="hdr"></header>
  <main id="main"><p class="note">Загружаю…</p></main>
</div>
<nav id="nav" hidden>
  <div class="in">
    <button type="button" data-act="tab" data-v="home" id="t-home">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h10v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M15 10h2a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-2"/><path d="M5 8a3 3 0 0 1 3-4 3 3 0 0 1 4 0 3 3 0 0 1 3 4"/><path d="M9 12v6M12 12v6"/></svg>
      <span>Сходка</span><i class="badge" id="b-home" hidden></i>
    </button>
    <button type="button" data-act="tab" data-v="cal" id="t-cal">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.4" fill="currentColor"/></svg>
      <span>Календарь</span>
    </button>
    <button type="button" data-act="tab" data-v="fb" id="t-fb">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6-4.9-4.6 6.6-.8z"/></svg>
      <span>Фидбек</span><i class="badge" id="b-fb" hidden></i>
    </button>
  </div>
</nav>
<div id="sheet"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="lib/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
var PEOPLE=[
  {id:'sanya',name:'Саня',gen:'Сани',tag:'лысый стратег',img:'img/sanya.jpg'},
  {id:'dima',name:'Диман',gen:'Димана',tag:'в панаме',img:'img/dima.jpg'},
  {id:'tyoma',name:'Тёма',gen:'Тёмы',tag:'при исполнении',img:'img/tyoma.jpg'}
];
var GROUP='img/group.jpg';
var PLACE_OPTS=[['bar','Бар'],['sanya','У Сани'],['dima','У Димана'],['tyoma','У Тёмы'],['online','Онлайн']];
var TIMES=['17:00','18:00','19:00','20:00','21:00','22:00'];
var BEERS=['Лагер','Чешское','IPA','Стаут','Пшеничное','Сидр','Безалкогольное'];
var STRONG=['Виски','Ром','Текила','Водка','Ягер','Без крепкого'];
var FOOD=['Шаверма','Пицца','Суши','Бургеры','Крылья','Без еды'];
var EXTRAS=[
  {k:'cards',t:'Карты берём?',o:[['yes','Берём'],['no','Без карт']]},
  {k:'walk',t:'Гуляем дальше?',o:[['yes','Гуляем'],['maybe','Посмотрим'],['no','По домам']]},
  {k:'politics',t:'За политику начнём…',o:[['p1','после 1-й'],['p2','после 2-й'],['p3','после 3-й'],['never','никогда (ага)']]}
];
var WD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
var WDF=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
var MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MONN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var STAR='M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6-4.9-4.6 6.6-.8z';
var CK='<svg class="ck" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function person(id){for(var i=0;i<PEOPLE.length;i++)if(PEOPLE[i].id===id)return PEOPLE[i];return {id:id,name:'?',gen:'?',img:''}}
function pad(n){return n<10?'0'+n:''+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function nice(s){var d=parse(s);return WD[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]}
function niceFull(s){var d=parse(s);return WDF[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]}
function short(s){var d=parse(s);return d.getDate()+' '+MON[d.getMonth()].slice(0,3)}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
var todayIso=iso(new Date());

var S={
  me:lsGet('beer.me'), tab:lsGet('beer.tab')||'home',
  proposals:{}, answers:{}, ratings:{}, comments:{}, homes:{},
  sheet:null, calMonth:null, selDate:todayIso, fbSel:null, draft:'',
  online:null, err:'', askSwitch:false
};
if(!person(S.me).img)S.me=null;
S.calMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);

/* ---------- derived ---------- */
function ans(pid,who){return S.answers[pid+'__'+who]||null}
function plist(){return Object.keys(S.proposals).map(function(id){return Object.assign({id:id},S.proposals[id])}).sort(function(a,b){return (a.date+a.time)<(b.date+b.time)?-1:1})}
function info(p){
  var inn=[],out=[],none=[];
  PEOPLE.forEach(function(x){var a=ans(p.id,x.id);if(a&&a.in===true)inn.push(x.id);else if(a&&a.in===false)out.push(x.id);else none.push(x.id)});
  return {inn:inn,out:out,none:none,confirmed:inn.length===3};
}
function placeTitle(pl){if(!pl)return '';if(pl.type==='bar')return pl.name?'Бар «'+pl.name+'»':'Бар';if(pl.type==='online')return 'Онлайн-созвон';return 'У '+person(pl.type).gen}
function placeAddr(pl){if(!pl||pl.type==='online')return 'каждый со своим пивом, ссылка в чате';return pl.address||'адрес не указан'}
function mapUrl(pl){return pl&&pl.address&&pl.type!=='online'?'https://yandex.ru/maps/?text='+encodeURIComponent(pl.address+(pl.type==='bar'&&pl.name?' '+pl.name:'')):''}
function pendingForMe(){return plist().filter(function(p){return p.date>=todayIso&&p.by!==S.me&&!ans(p.id,S.me)})}
function confirmedUpcoming(){return plist().filter(function(p){return p.date>=todayIso&&info(p).confirmed})}
function waiting(){return plist().filter(function(p){var i=info(p);return p.date>=todayIso&&!i.confirmed&&(p.by===S.me||ans(p.id,S.me))})}
function pastConfirmed(){return plist().filter(function(p){return p.date<=todayIso&&info(p).confirmed}).reverse()}
function unratedPast(){return pastConfirmed().filter(function(p){var r=S.ratings[p.id+'__'+S.me];return p.date<todayIso||(p.date===todayIso)?!(r&&(r.beer||r.meet)):false})}

var db=null;
function persist(){lsSet('beer.v2',JSON.stringify({proposals:S.proposals,answers:S.answers,ratings:S.ratings,comments:S.comments,homes:S.homes}))}
var COLL={proposals:'proposals',answers:'answers',ratings:'ratings',comments:'comments',homes:'homes'};
function applyRow(id,data){var i=id.indexOf('/'),c=id.slice(0,i),k=id.slice(i+1);if(COLL[c])S[c][k]=data}
function dropRow(id){var i=id.indexOf('/'),c=id.slice(0,i),k=id.slice(i+1);if(COLL[c])delete S[c][k]}
function fail(e){toast('Не отправилось в общую базу. Проверь интернет.');console.log(e)}
function put(coll,key,data){
  S[coll][key]=data;persist();render();

}
function del(coll,key){

}

  return '<button type="button" class="opt'+(on?' on':'')+'" data-act="'+act+'" data-k="'+(k||'')+'" data-v="'+esc(v)+'" aria-pressed="'+on+'">'+CK+esc(l)+'</button>'}).join('')}
function stack(ids){return '<span class="stack">'+ids.map(function(id){return '<img src="'+person(id).img+'" alt="'+esc(person(id).name)+'">'}).join('')+'</span>'}
function stars(v,size,act,k){var o='';for(var i=1;i<=5;i++){var svg='<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" aria-hidden="true"><path d="'+STAR+'" fill="'+(i<=v?'#F2A73B':'none')+'" stroke="#F2A73B" stroke-width="1.7" stroke-linejoin="round"/></svg>';o+=act?'<button type="button" class="starbtn" data-act="'+act+'" data-k="'+k+'" data-v="'+i+'" aria-label="'+i+' из 5">'+svg+'</button>':svg}return '<div class="stars">'+o+'</div>'}
function whereBlock(p){var u=mapUrl(p.place);return '<div class="where"><b>'+esc(placeTitle(p.place))+'</b><span>'+esc(placeAddr(p.place))+'</span>'+(u?' <a class="maplink" href="'+u+'" target="_blank" rel="noopener">на карте</a>':'')+'</div>'}
function peopleRow(p){var i=info(p);return '<div class="people">'+PEOPLE.map(function(x){var a=ans(p.id,x.id);var cls=a&&a.in===true?'in':a&&a.in===false?'out':'';var st=a&&a.in===true?'в теме':a&&a.in===false?'пас':'молчит';var pl=a&&a.in&&a.plus?'<span class="plus">+'+a.plus+'</span>':'';
  return '<div class="person"><img class="ava '+cls+'" src="'+x.img+'" alt="">'+pl+'<div style="font-weight:600;font-size:13px">'+x.name+'</div><div class="st '+cls+'">'+st+'</div></div>'}).join('')+'</div>'}
function aggregate(p){
  var rows=[];
  function tally(field,label){var m={};PEOPLE.forEach(function(x){var a=ans(p.id,x.id);if(a&&a.in&&a[field])a[field].forEach(function(v){(m[v]=m[v]||[]).push(x.id)})});
    var ks=Object.keys(m).sort(function(a,b){return m[b].length-m[a].length});if(ks.length)rows.push('<div class="aggrow"><span><span class="lbl">'+label+':</span> '+ks.map(function(k){return esc(k)}).join(', ')+'</span>'+stack(m[ks[0]])+'</div>')}
  tally('beer','Пиво');tally('strong','Покрепче');tally('food','Еда');
  var plus=PEOPLE.map(function(x){var a=ans(p.id,x.id);return a&&a.in&&a.plus?x.name+' +'+a.plus:null}).filter(Boolean);
  if(plus.length)rows.push('<div class="aggrow"><span><span class="lbl">Плюсы:</span> '+esc(plus.join(', '))+'</span></div>');
  EXTRAS.forEach(function(e){var m={};PEOPLE.forEach(function(x){var a=ans(p.id,x.id);var v=a&&a.in&&a.extras&&a.extras[e.k];if(v)(m[v]=m[v]||[]).push(x.id)});var ks=Object.keys(m);if(ks.length){var lab={};e.o.forEach(function(o){lab[o[0]]=o[1]});rows.push('<div class="aggrow"><span><span class="lbl">'+e.t+'</span> '+ks.map(function(k){return esc(lab[k])+' ('+m[k].length+')'}).join(', ')+'</span></div>')}});
  return rows.length?'<div class="agg">'+rows.join('')+'</div>':'<p class="note">Пока никто не выбрал, что пьём и едим.</p>';
}

  } else {
    var pp=Object.assign({id:sh.pid},S.proposals[sh.pid]||{});
    head='<h2>'+esc(nice(pp.date||todayIso))+' · '+esc(pp.time||'')+'</h2>';
    body='<div class="where" style="margin-top:-6px"><b>'+esc(placeTitle(pp.place))+'</b><span>'+esc(placeAddr(pp.place))+'</span></div>'+picks(sh);
    foot='<button type="button" class="btn wide" data-act="sh-answer">Готово, я в теме</button>';
  }
  el.innerHTML='<div class="scrim" data-act="sh-scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="Сходка"><div class="sheet-head">'+head+'<button type="button" class="iconbtn" data-act="sh-close" aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="sheet-body">'+body+'</div><div class="sheet-foot">'+foot+'</div></div></div>';
}

function render(){
  var focusId=document.activeElement&&document.activeElement.id,sel=null;
  if(focusId&&document.activeElement.selectionStart!=null)sel=document.activeElement.selectionStart;
  var sb=document.querySelector('.sheet-body'),sbTop=sb?sb.scrollTop:0;
  renderHeader();
  var main=document.getElementById('main'),nav=document.getElementById('nav');
  var h='';
  if(S.online===false)h+='<div class="banner">Нет связи с общей базой. Проверь интернет — как связь появится, всё обновится само.</div>';
  if(S.askSwitch&&S.me)h+='<div class="card"><div class="switchbar"><span>Ты <b>'+person(S.me).name+'</b>. Сменить пользователя?</span><span class="row"><button type="button" class="btn ghost" data-act="noswitch">Нет</button><button type="button" class="btn" data-act="switch">Сменить</button></span></div></div>';
  if(!S.me){main.innerHTML=h+viewPick();nav.hidden=true;renderSheet();return}
  nav.hidden=false;
  ['home','cal','fb'].forEach(function(t){document.getElementById('t-'+t).className=S.tab===t?'act':''});
  var n=pendingForMe().length,bh=document.getElementById('b-home');bh.hidden=!n;bh.textContent=n;
  var nf=unratedPast().length,bf=document.getElementById('b-fb');bf.hidden=!nf;bf.textContent=nf;
  h+=S.tab==='cal'?viewCal():S.tab==='fb'?viewFb():viewHome();
  main.innerHTML=h;
  renderSheet();
  var sb2=document.querySelector('.sheet-body');if(sb2)sb2.scrollTop=sbTop;
  if(focusId){var f=document.getElementById(focusId);if(f&&f.focus){f.focus();if(sel!=null&&f.setSelectionRange)f.setSelectionRange(sel,sel)}}
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act'),v=b.getAttribute('data-v'),k=b.getAttribute('data-k');
  if(a==='sh-scrim'&&e.target!==b)return;
  var sh=S.sheet;
  switch(a){
    case 'iam':S.me=v;S.askSwitch=false;lsSet('beer.me',v);render();scrollTo(0,0);break;
    case 'askswitch':S.askSwitch=!S.askSwitch;render();scrollTo(0,0);break;
    case 'noswitch':S.askSwitch=false;render();break;
    case 'switch':S.me=null;S.askSwitch=false;lsSet('beer.me','');render();break;
    case 'tab':S.tab=v;lsSet('beer.tab',v);render();scrollTo(0,0);break;
    case 'mon':S.calMonth=new Date(S.calMonth.getFullYear(),S.calMonth.getMonth()+(+v),1);render();break;
    case 'day':
      S.selDate=v;var hasP=plist().some(function(p){return p.date===v});
      if(!hasP&&v>=todayIso)openNew(v);else render();break;
    case 'new':S.tab=S.tab||'home';openNew(v||null);break;
    case 'join':
      var a0=ans(v,S.me);if(!a0||a0.in!==true){put('answers',v+'__'+S.me,Object.assign({},a0||{},{in:true,at:Date.now()}));
        var p0=Object.assign({id:v},S.proposals[v]);toast(info(p0).confirmed?'Все в теме — сходка подтверждена!':'Ты в теме · видят все')}
      openAnswer(v);break;
    case 'pass':put('answers',v+'__'+S.me,{in:false,at:Date.now()});toast('Ты пас · видят все');break;
    case 'edit':openAnswer(v);break;
    case 'delprop':
      PEOPLE.forEach(function(x){if(S.answers[v+'__'+x.id])del('answers',v+'__'+x.id)});del('proposals',v);toast('Предложение отменено');break;
    case 'rate-go':S.fbSel=v;S.tab='fb';lsSet('beer.tab','fb');render();scrollTo(0,0);break;
    case 'fbsel':S.fbSel=v;S.draft='';render();break;
    case 'rate':var rk=S.fbSel+'__'+S.me;var r=Object.assign({},S.ratings[rk]||{});r[k]=+v;put('ratings',rk,r);toast('Оценка сохранена');break;
    /* sheet */
    case 'sh-close':case 'sh-scrim':S.sheet=null;render();break;
    case 'sh-set':sh[k]=sh[k]===v&&k!=='date'?null:v;render();break;
    case 'sh-place':sh.place=sh.place===v?null:v;
      if(sh.place&&sh.place!=='bar'&&sh.place!=='online'){var hm=S.homes[sh.place];sh.address=hm&&hm.address||''}else if(sh.place!=='bar')sh.address='';
      render();break;
    case 'sh-multi':var l=sh[k],ix=l.indexOf(v);if(ix>=0)l.splice(ix,1);else{l.push(v);
      if(v.indexOf('Без ')===0)sh[k]=[v];else{var nx=l.filter(function(x){return x.indexOf('Без ')!==0});sh[k]=nx}}render();break;
    case 'sh-plus':sh.plus=Math.max(0,Math.min(5,sh.plus+(+v)));render();break;
    case 'sh-extra':sh.extras[k]=sh.extras[k]===v?null:v;render();break;
    case 'sh-confirm':
      if(!sh.date||!sh.place||!sh.time||(sh.place==='bar'&&!sh.barName.trim()))break;
      var pid=newId();
      var place={type:sh.place==='bar'?'bar':sh.place};
      if(sh.place==='bar')place.name=sh.barName.trim();
      if(sh.place!=='online')place.address=sh.address.trim();
      put('proposals',pid,{date:sh.date,time:sh.time,place:place,by:S.me,at:Date.now()});
      put('answers',pid+'__'+S.me,{in:true,beer:sh.beer,strong:sh.strong,food:sh.food,plus:sh.plus,extras:sh.extras,at:Date.now()});
      if(sh.place!=='bar'&&sh.place!=='online'&&place.address)put('homes',sh.place,{address:place.address});
      S.selDate=sh.date;S.sheet={mode:'new',stage:'done',pid:pid};render();break;
    case 'sh-answer':
      var key=sh.pid+'__'+S.me;
      put('answers',key,{in:true,beer:sh.beer,strong:sh.strong,food:sh.food,plus:sh.plus,extras:sh.extras,at:Date.now()});
      var pp=Object.assign({id:sh.pid},S.proposals[sh.pid]);var ok=info(pp).confirmed;
      S.sheet={mode:'answer',stage:'done',pid:sh.pid};render();toast(ok?'Все в теме — сходка подтверждена!':'Сохранено · видят все');break;
  }
});
document.addEventListener('input',function(e){
  if(e.target.id==='cmt')S.draft=e.target.value;
  var k=e.target.getAttribute&&e.target.getAttribute('data-k');
  if(S.sheet&&k&&(k==='barName'||k==='address')){S.sheet[k]=e.target.value;
    if(k==='barName'){var f=document.querySelector('[data-act=sh-confirm]');var sh=S.sheet;var miss=!sh.date||!sh.place||!sh.time||!sh.barName.trim();if(f)f.disabled=miss;var hint=document.querySelector('.sheet-foot .lbl');if(hint&&!miss)hint.remove()}}
});
document.addEventListener('submit',function(e){
  if(e.target.id!=='cform')return;e.preventDefault();
  var t=(S.draft||'').trim();if(!t||!S.fbSel)return;
  S.draft='';put('comments',S.fbSel+'__'+Date.now()+'__'+S.me,{by:S.me,text:t,at:Date.now()});toast('Коммент отправлен');
});
window.appBack=function(){
  if(S.sheet){S.sheet=null;render();return true}
  if(S.me&&S.tab!=='home'){S.tab='home';lsSet('beer.tab','home');render();scrollTo(0,0);return true}
  return false;
};

render();

/* ---------- live sync ---------- */
var cfg=window.BEER_CFG||{};
if(cfg.url&&cfg.key&&window.supabase){
  db=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:false,autoRefreshToken:false}});
  var pull=function(){
    return db.from('docs').select('id,data').then(function(r){
      if(r.error){if(++pullFails>=2){S.online=false;render()}return}
      pullFails=0;S.online=true;Object.keys(COLL).forEach(function(c){S[c]={}});
      (r.data||[]).forEach(function(row){applyRow(row.id,row.data)});
      persist();render();
    },function(){if(++pullFails>=2){S.online=false;render()}});
  };
  var pullFails=0;
  pull();
  db.channel('docs-live').on('postgres_changes',{event:'*',schema:'public',table:'docs'},function(p){
    if(p.eventType==='DELETE'){if(p.old&&p.old.id)dropRow(p.old.id)}
    else if(p.new&&p.new.id)applyRow(p.new.id,p.new.data);
    persist();render();
  }).subscribe();
  setInterval(pull,30000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)pull()});
}
})();
</script>
</body>
</html>
